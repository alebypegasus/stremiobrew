<!doctype html>
<html>
<head><meta charset="UTF-8"><title>StremioBrew</title>
<style>
html,body{margin:0;height:100%;background:#0c0b11;font-family:sans-serif;overflow:hidden}
#splash{position:fixed;inset:0;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center}
#logo{width:168px;height:168px;border-radius:38px;object-fit:cover;box-shadow:0 16px 60px rgba(0,0,0,.5);animation:b 2.2s ease-in-out infinite}
#hint{position:fixed;left:0;right:0;bottom:13%;text-align:center;color:rgba(255,255,255,.5);font-size:20px;letter-spacing:.5px;opacity:0;transition:opacity .6s}
@keyframes b{0%,100%{transform:scale(1);opacity:.82}50%{transform:scale(1.06);opacity:1}}
</style></head>
<body>
<div id="splash"><img id="logo" src="icon.png"></div>
<div id="hint">Starting Stremio&#8230;</div>
<script>
// Same launcher as the classic app (proven): start tvserver via Homebrew exec if
// :8080 isn't up, wait for the port in the exec itself, poll /ping, then load the
// BETA shell. Both apps share one server; whichever launches first starts it.
var SVC = '/media/developer/apps/usr/palm/services/io.strem.tv.beta.server';
var SHELL_URL = 'http://127.0.0.1:8080/beta';
var done = false;
function go() { if (!done) { done = true; window.location.replace(SHELL_URL); } }

var cmd =
  'SVC=' + SVC + '; ' +
  'netstat -tln 2>/dev/null | grep -q :8080 || ' +
  '{ HOME=/home/root USER=root ' +
  'FFMPEG_BIN=$SVC/bin/ffmpeg FFPROBE_BIN=$SVC/bin/ffprobe ' +
  'setsid /lib/ld-linux.so.3 --library-path $SVC/bin/lib $SVC/bin/node18 --max-old-space-size=96 ' +
  '$SVC/tvserver.js >$SVC/tvserver.log 2>&1 </dev/null & }; ' +
  'n=0; while [ $n -lt 75 ]; do netstat -tln 2>/dev/null | grep -q :8080 && break; sleep 1; n=$((n+1)); done; ' +
  'netstat -tln 2>/dev/null | grep -q :8080 && echo TVUP || echo TVDOWN';

try {
  var bridge = new PalmServiceBridge();
  bridge.onservicecallback = function (response) { if (String(response).indexOf('TVUP') >= 0) go(); };
  bridge.call('luna://org.webosbrew.hbchannel.service/exec', JSON.stringify({ command: cmd }));
} catch (e) {}

function ping(cb) {
  try {
    var x = new XMLHttpRequest();
    x.open('GET', 'http://127.0.0.1:8080/ping?t=' + Date.now(), true);
    x.timeout = 1500;
    x.onreadystatechange = function () { if (x.readyState === 4) cb(x.status === 200); };
    x.onerror = function () { cb(false); };
    x.ontimeout = function () { cb(false); };
    x.send();
  } catch (e) { cb(false); }
}
function poll() {
  if (done) return;
  ping(function (up) {
    if (up) { go(); return; }
    setTimeout(poll, 200);   // keep waiting on the logo — never show an error screen
  });
}
poll();
setTimeout(function () { var s = document.getElementById('hint'); if (s && !done) s.style.opacity = '1'; }, 2500);
</script>
</body>
</html>
