<!doctype html>
<html>
<head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>StremioBrew</title>
<style>
html,body{margin:0;height:100%;background:#0c0b11 url('background.png') no-repeat center center / cover;font-family:sans-serif;overflow:hidden}
</style></head>
<body>
<script>
var SVC = '/media/developer/apps/usr/palm/services/io.strem.tv.beta.server';
var SHELL_URL = 'http://127.0.0.1:8080/beta';
var done = false;

function go() {
  if (!done) {
    done = true;
    window.location.replace(SHELL_URL);
  }
}

var cmd =
  'SVC=' + SVC + '; ' +
  'netstat -tln 2>/dev/null | grep -q :8080 || ' +
  '{ HOME=/home/root USER=root ' +
  'FFMPEG_BIN=$SVC/bin/ffmpeg FFPROBE_BIN=$SVC/bin/ffprobe ' +
  'setsid /lib/ld-linux.so.3 --library-path $SVC/bin/lib $SVC/bin/node18 ' +
  '$SVC/tvserver.js >$SVC/tvserver.log 2>&1 </dev/null & }; ' +
  'n=0; while [ $n -lt 75 ]; do netstat -tln 2>/dev/null | grep -q :8080 && break; sleep 1; n=$((n+1)); done; ' +
  'netstat -tln 2>/dev/null | grep -q :8080 && echo TVUP || echo TVDOWN';

try {
  var bridge = new PalmServiceBridge();
  bridge.onservicecallback = function (response) {
    if (String(response).indexOf('TVUP') >= 0) {
      go();
    }
  };
  bridge.call('luna://org.webosbrew.hbchannel.service/exec', JSON.stringify({ command: cmd }));
} catch (e) {}

function ping(cb) {
  try {
    var x = new XMLHttpRequest();
    x.open('GET', 'http://127.0.0.1:8080/ping?t=' + Date.now(), true);
    x.timeout = 1500;
    x.onreadystatechange = function () { if (x.readyState === 4) cb(x.status === 200); };
    x.onerror = function () { cb(false); };
    x.ontimeout = function () { cb(false); };
    x.send();
  } catch (e) { cb(false); }
}
function poll() {
  if (done) return;
  ping(function (up) {
    if (up) {
      go();
      return;
    }
    setTimeout(poll, 200);
  });
}
poll();
setTimeout(function () { var s = document.getElementById('hint'); if (s && !done) s.style.opacity = '1'; }, 2500);
</script>
</body>
</html>
